name: Build Android (Play Store)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Keystore 서명 설정
      # GitHub Secrets에 추가 필요:
      #   KEYSTORE_BASE64    (base64로 인코딩된 .jks 파일: base64 keystore.jks)
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build AAB (release)
        run: |
          flutter build appbundle --release \
            --dart-define=KEYSTORE_PATH=keystore.jks \
            --dart-define=KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            --dart-define=KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            --dart-define=KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
        env:
          KEYSTORE_PATH: android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sutandard-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
