        포털 비밀번호로 인증 후 수강신청 내역을 조회하여 시간표를 자동 생성합니다.
        포털 비밀번호는 인증에만 사용되며 서버에 저장되지 않습니다.

        이미 "포털 시간표"가 존재하면 기존 과목을 초기화하고 다시 생성합니다.
      summary: 포털 수강신청 내역으로 시간표 생성
      tags:
      - 시간표
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TimetableImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TimetableImportRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableImportResponse'
          description: ''
  /api/v1/timetables/now/:
    get:
      operationId: v1_timetables_now_retrieve
      description: 대표 시간표 기준으로 현재 진행 중인 수업과 다음 수업을 반환합니다.
      summary: 현재/다음 수업 조회
      tags:
      - 시간표
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentNextCourseResponse'
          description: ''
  /api/v1/timetables/wizard/:
    post:
      operationId: v1_timetables_wizard_create
      description: |-
        원하는 과목(course_code 목록)과 제약 조건을 전달하면, 시간 충돌 없이 수강 가능한 시간표 조합을 반환합니다.

        **옵션:**
        - exclude_first_period: 1교시(~10:00) 수업 제외
        - lunch_break: 점심시간(12:00~13:00) 확보
        - max_days: 주N일 제한 (3 또는 4)

        각 course_code에서 분반 하나씩 선택하여 조합을 생성합니다.
      summary: 시간표 마법사 — 자동 조합 생성
      tags:
      - 시간표
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WizardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WizardRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardResponse'
          description: ''
