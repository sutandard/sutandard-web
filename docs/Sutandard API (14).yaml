openapi: 3.0.3
info:
  title: Sutandard API
  version: 1.1.0
  description: 수원대학교 시간표 관리 서비스 Sutandard의 REST API 문서입니다.
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      description: 현재 사이트 비밀번호를 확인하고 새 비밀번호로 변경합니다.
      summary: 비밀번호 변경
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
            examples:
              요청예시:
                value:
                  current_password: mysite_pw123!
                  new_password: newsite_pw456!
                  new_password_confirm: newsite_pw456!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: 학번과 사이트 비밀번호로 로그인하고 JWT 토큰을 반환합니다.
      summary: 로그인
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  password: mysite_pw123!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: refresh 토큰을 블랙리스트에 추가하여 로그아웃합니다.
      summary: 로그아웃
      tags:
      - 인증
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: 'GET: 내 계정 정보 조회. PATCH: 이메일 수정.'
      summary: 내 정보 조회/수정
      tags:
      - 인증
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      description: 'GET: 내 계정 정보 조회. PATCH: 이메일 수정.'
      summary: 내 정보 조회/수정
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/portal-check/:
    post:
      operationId: v1_auth_portal_check_create
      description: |-
        학번과 포털 비밀번호가 유효한지 확인합니다. 회원가입 전 자격증명 검증에 사용합니다.
        포털 비밀번호는 인증에만 사용되며 서버에 저장되지 않습니다.
      summary: 포털 인증 확인
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalCheck'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  portal_password: 포털비밀번호
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PortalCheck'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PortalCheck'
        required: true
      responses:
        '200':
          description: valid=true이면 인증 성공, valid=false이면 실패
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: |-
        포털 비밀번호로 수원대 포털 인증 후 사이트 계정을 생성합니다.
        포털 비밀번호는 인증에만 사용되며 서버에 저장되지 않습니다.
      summary: 회원가입
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  portal_password: 포털비밀번호
                  password: mysite_pw123!
                  password_confirm: mysite_pw123!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: |-
        포털 비밀번호로 본인 인증 후 사이트 비밀번호를 재설정합니다.
        포털 비밀번호는 인증에만 사용되며 서버에 저장되지 않습니다.
      summary: 비밀번호 재설정
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  portal_password: 포털비밀번호
                  new_password: newsite_pw456!
                  new_password_confirm: newsite_pw456!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/community/home/quick-timetable/:
    get:
      operationId: v1_community_home_quick_timetable_retrieve
      description: 대표 시간표의 요일별 수업 요약을 반환합니다. 모바일 홈 위젯 렌더링에 최적화된 경량 응답입니다.
      summary: 간편 시간표 (모바일 위젯용)
      tags:
      - 홈 위젯
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickTimetableResponse'
          description: ''
  /api/v1/community/home/today/:
    get:
      operationId: v1_community_home_today_retrieve
      description: 대표 시간표 기준으로 오늘의 모든 수업을 시간순으로 반환합니다. 각 수업에 상태(done/in_progress/upcoming)가
        포함됩니다.
      summary: 오늘 전체 일정
      tags:
      - 홈 위젯
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayScheduleResponse'
          description: ''
  /api/v1/community/posts/:
    get:
      operationId: v1_community_posts_list
      description: 시간표 공유 커뮤니티 피드를 페이지네이션으로 조회합니다.
      summary: 피드 목록 조회
      parameters:
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 커뮤니티
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostListList'
          description: ''
    post:
      operationId: v1_community_posts_create
      description: 시간표 공유 게시글을 작성합니다. 위젯(강의 카드, 시간표 미리보기 등)을 첨부할 수 있습니다.
      summary: 게시글 작성
      tags:
      - 커뮤니티
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostCreate'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCreate'
          description: ''
  /api/v1/community/posts/{id}/:
    get:
      operationId: v1_community_posts_retrieve
      summary: 게시글 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
    put:
      operationId: v1_community_posts_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostDetail'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
    patch:
      operationId: v1_community_posts_partial_update
      summary: 게시글 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPostUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPostUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPostUpdate'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
    delete:
      operationId: v1_community_posts_destroy
      summary: 게시글 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/community/posts/{id}/like/:
    post:
      operationId: v1_community_posts_like_create
      description: 게시글에 좋아요를 누르거나 취소합니다.
      summary: 좋아요 토글
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeToggleResponse'
          description: ''
  /api/v1/community/posts/{post_pk}/comments/:
    get:
      operationId: v1_community_posts_comments_list
      summary: 댓글 목록 조회
      parameters:
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      - in: path
        name: post_pk
        schema:
          type: integer
        required: true
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 커뮤니티
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentList'
          description: ''
    post:
      operationId: v1_community_posts_comments_create
      description: 댓글을 작성합니다. 위젯(강의 카드 등)을 첨부할 수 있습니다.
      summary: 댓글 작성
      parameters:
      - in: path
        name: post_pk
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreate'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreate'
          description: ''
  /api/v1/community/posts/{post_pk}/comments/{id}/:
    patch:
      operationId: v1_community_posts_comments_partial_update
      summary: 댓글 수정
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: post_pk
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_community_posts_comments_destroy
      summary: 댓글 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: post_pk
        schema:
          type: integer
        required: true
      tags:
      - 커뮤니티
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/courses/:
    get:
      operationId: v1_courses_list
      description: 학기·유형·이러닝 등으로 필터링하고 이름·학수번호·교수명으로 검색합니다.
      summary: 과목 목록 조회
      parameters:
      - in: query
        name: course_type
        schema:
          type: string
        description: '이수구분 필터. 콤마 구분으로 다중값 가능 (예: 전핵,전선)'
      - in: query
        name: department
        schema:
          type: string
        description: 학과 코드로 필터 (Department.code)
      - in: query
        name: is_elearning
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
        description: '후기 기간 필터. 해당 기간에 후기가 달린 과목만 반환합니다. 값: THIS_SEMESTER(현재 학기),
          ONE_YEAR(최근 1년), TWO_YEARS(최근 2년)'
      - in: query
        name: professor
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: integer
      - in: query
        name: year_level
        schema:
          type: string
        description: '대상학년 필터. 콤마 구분으로 다중값 가능 (예: 1,2)'
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseListList'
          description: ''
  /api/v1/courses/{id}/:
    get:
      operationId: v1_courses_retrieve
      summary: 과목 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/v1/courses/batch/:
    post:
      operationId: v1_courses_batch_create
      description: 여러 과목 id를 한 번에 전달해 스케줄·후기 통계를 일괄 반환합니다. 시간표 마법사 등에서 활용하세요.
      summary: 과목 상세 일괄 조회
      tags:
      - 과목
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursesBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoursesBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoursesBatchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/v1/courses/classrooms/:
    get:
      operationId: v1_courses_classrooms_list
      summary: 강의실 목록 조회
      parameters:
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Classroom'
          description: ''
  /api/v1/courses/classrooms/{id}/schedule/:
    get:
      operationId: v1_courses_classrooms_schedule_retrieve
      description: 특정 강의실의 주간 시간표를 반환합니다. semester 미제공 시 최신 학기가 자동 선택됩니다.
      summary: 강의실 시간표 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: semester
        schema:
          type: integer
        description: 학기 PK (미제공 시 최신 학기)
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
