openapi: 3.0.3
info:
  title: Sutandard API
  version: 1.0.0
  description: 수원대학교 시간표 관리 서비스 Sutandard의 REST API 문서입니다.
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: 현재 사이트 비밀번호를 확인하고 새 비밀번호로 변경합니다.
      summary: 비밀번호 변경
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
            examples:
              요청예시:
                value:
                  current_password: mysite_pw123!
                  new_password: newsite_pw456!
                  new_password_confirm: newsite_pw456!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 학번과 사이트 비밀번호로 로그인하고 JWT 토큰을 반환합니다.
      summary: 로그인
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  password: mysite_pw123!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: refresh 토큰을 블랙리스트에 추가하여 로그아웃합니다.
      summary: 로그아웃
      tags:
      - 인증
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: 'GET: 내 계정 정보 조회. PATCH: 이메일 수정.'
      summary: 내 정보 조회/수정
      tags:
      - 인증
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: 'GET: 내 계정 정보 조회. PATCH: 이메일 수정.'
      summary: 내 정보 조회/수정
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/portal-check/:
    post:
      operationId: auth_portal_check_create
      description: |-
        학번과 포털 비밀번호가 유효한지 확인합니다. 회원가입 전 자격증명 검증에 사용합니다.
        포털 비밀번호는 인증에만 사용되며 서버에 저장되지 않습니다.
      summary: 포털 인증 확인
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalCheck'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  portal_password: 포털비밀번호
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PortalCheck'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PortalCheck'
        required: true
      responses:
        '200':
          description: valid=true이면 인증 성공, valid=false이면 실패
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        포털 비밀번호로 수원대 포털 인증 후 사이트 계정을 생성합니다.
        포털 비밀번호는 인증에만 사용되며 서버에 저장되지 않습니다.
      summary: 회원가입
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  portal_password: 포털비밀번호
                  password: mysite_pw123!
                  password_confirm: mysite_pw123!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: |-
        포털 비밀번호로 본인 인증 후 사이트 비밀번호를 재설정합니다.
        포털 비밀번호는 인증에만 사용되며 서버에 저장되지 않습니다.
      summary: 비밀번호 재설정
      tags:
      - 인증
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
            examples:
              요청예시:
                value:
                  student_id: '20201234'
                  portal_password: 포털비밀번호
                  new_password: newsite_pw456!
                  new_password_confirm: newsite_pw456!
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/courses/:
    get:
      operationId: courses_list
      description: 학기·유형·이러닝 등으로 필터링하고 이름·학수번호·교수명으로 검색합니다.
      summary: 과목 목록 조회
      parameters:
      - in: query
        name: course_type
        schema:
          type: string
          title: 이수구분
          enum:
          - RT
          - 공통
          - 교직
          - 기교
          - 기타
          - 선교
          - 선수
          - 소교
          - 전공
          - 전교
          - 전선
          - 전취
          - 전핵
          - 중핵
        description: |-
          * `전핵` - 전공핵심
          * `전선` - 전공선택
          * `전공` - 전공
          * `전교` - 전공교육
          * `전취` - 전공취득
          * `중핵` - 중핵교양
          * `기교` - 기초교양
          * `선교` - 선택교양
          * `소교` - 소양교양
          * `교직` - 교직
          * `공통` - 공통
          * `선수` - 선수과목
          * `RT` - RT
          * `기타` - 기타
      - in: query
        name: department
        schema:
          type: string
        description: 학과 코드로 필터 (Department.code)
      - in: query
        name: is_elearning
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: string
        description: '후기 기간 필터. 해당 기간에 후기가 달린 과목만 반환합니다. 값: THIS_SEMESTER(현재 학기),
          ONE_YEAR(최근 1년), TWO_YEARS(최근 2년)'
      - in: query
        name: professor
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      - in: query
        name: semester
        schema:
          type: integer
      - in: query
        name: year_level
        schema:
          type: integer
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseListList'
          description: ''
  /api/courses/{id}/:
    get:
      operationId: courses_retrieve
      summary: 과목 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/courses/batch/:
    post:
      operationId: courses_batch_create
      description: 여러 과목 id를 한 번에 전달해 스케줄·후기 통계를 일괄 반환합니다. 시간표 마법사 등에서 활용하세요.
      summary: 과목 상세 일괄 조회
      tags:
      - 과목
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: No response body
  /api/courses/classrooms/:
    get:
      operationId: courses_classrooms_list
      summary: 강의실 목록 조회
      parameters:
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Classroom'
          description: ''
  /api/courses/classrooms/{id}/schedule/:
    get:
      operationId: courses_classrooms_schedule_retrieve
      description: 특정 강의실의 주간 시간표를 반환합니다. semester 미제공 시 최신 학기가 자동 선택됩니다.
      summary: 강의실 시간표 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: semester
        schema:
          type: integer
        description: 학기 PK (미제공 시 최신 학기)
      tags:
      - 과목
      responses:
        '200':
          description: No response body
  /api/courses/classrooms/available/:
    get:
      operationId: courses_classrooms_available_list
      description: 현재 시각 기준으로 수업이 없는 강의실 목록을 반환합니다.
      summary: 현재 비어있는 강의실 조회
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Classroom'
          description: ''
  /api/courses/colleges/:
    get:
      operationId: courses_colleges_list
      description: 단과대 목록과 소속 학과 수를 반환합니다.
      summary: 단과대 목록 조회
      parameters:
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/College'
          description: ''
  /api/courses/departments/:
    get:
      operationId: courses_departments_list
      description: 과목 검색 필터용 학과 목록을 반환합니다. code 값을 /api/courses/?department=<code>
        에 사용하세요. college 파라미터로 단과대별 필터링 가능합니다.
      summary: 학과 목록 조회
      parameters:
      - in: query
        name: college
        schema:
          type: integer
        description: 단과대 PK로 필터
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          description: ''
  /api/courses/professors/:
    get:
      operationId: courses_professors_list
      summary: 교수 목록 조회
      parameters:
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 교수
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfessorList'
          description: ''
  /api/courses/professors/{id}/:
    get:
      operationId: courses_professors_retrieve
      description: 교수 기본 정보(이메일·전화·연구실)와 오피스아워 전체를 반환합니다.
      summary: 교수 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 교수
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorDetail'
          description: ''
  /api/courses/professors/{id}/office-hours/:
    get:
      operationId: courses_professors_office_hours_retrieve
      description: 해당 교수의 오피스아워 목록만 반환합니다. 요일·시작/종료 시간·장소·비고 포함.
      summary: 교수 오피스아워 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 교수
      responses:
        '200':
          description: No response body
  /api/courses/professors/{id}/schedule/:
    get:
      operationId: courses_professors_schedule_retrieve
      description: 해당 교수가 담당하는 과목과 강의 일정을 반환합니다. semester 미제공 시 최신 학기가 자동 선택됩니다.
      summary: 교수 시간표 조회
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: semester
        schema:
          type: integer
        description: 학기 PK (미제공 시 최신 학기)
      tags:
      - 교수
      responses:
        '200':
          description: No response body
  /api/courses/semesters/:
    get:
      operationId: courses_semesters_list
      summary: 학기 목록 조회
      parameters:
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: 검색어.
        schema:
          type: string
      tags:
      - 과목
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Semester'
          description: ''
  /api/courses/subjects/:
    get:
      operationId: courses_subjects_retrieve
      description: 같은 course_code+학기를 묶어 과목 단위로 반환합니다. section_count로 몇 분반이 열리는지 확인할
        수 있습니다.
      summary: 과목 목록 조회 (분반 묶음)
      parameters:
      - in: query
        name: college
        schema:
          type: string
        description: 개설대학
      - in: query
        name: course_type
        schema:
          type: string
        description: '이수구분 (예: 전핵, 전선)'
      - in: query
        name: department
        schema:
          type: string
        description: 학과 코드 (Department.code)
      - in: query
        name: ordering
        schema:
          type: string
        description: 정렬 필드 (name, -name, credits, -credits, course_code, -course_code)
      - in: query
        name: search
        schema:
          type: string
        description: 과목명·학수번호 검색
      - in: query
        name: semester
        schema:
          type: integer
        description: 학기 PK
      - in: query
        name: year_level
        schema:
          type: integer
        description: 대상학년
      tags:
      - 과목
      responses:
        '200':
          description: No response body
  /api/courses/subjects/{course_code}/:
    get:
      operationId: courses_subjects_retrieve_2
      description: 해당 course_code의 모든 분반을 sections 배열로 반환합니다. semester 미제공 시 최신 학기가
        자동 선택됩니다.
      summary: 과목 상세 조회 (전 분반)
      parameters:
      - in: path
        name: course_code
        schema:
          type: string
        required: true
      - in: query
        name: semester
        schema:
          type: integer
        description: 학기 PK (미제공 시 최신 학기)
      tags:
      - 과목
      responses:
        '200':
          description: No response body
  /api/reviews/:
    get:
      operationId: reviews_list
      description: 'GET: 강의 후기 목록 조회 (course_id 쿼리파라미터로 필터링). POST: 후기 작성 (인증 필요).'
      summary: 강의 후기 목록 조회 / 작성
      parameters:
      - name: ordering
        required: false
        in: query
        description: 결과 정렬 시 사용할 필드.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      tags:
      - 후기
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseReviewList'
          description: ''
    post:
      operationId: reviews_create
      description: 'GET: 강의 후기 목록 조회 (course_id 쿼리파라미터로 필터링). POST: 후기 작성 (인증 필요).'
      summary: 강의 후기 목록 조회 / 작성
      tags:
      - 후기
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseReview'
          application/x-www-form-urlencoded:
            schema:
